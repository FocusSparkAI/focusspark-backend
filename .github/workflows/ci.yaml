name: CI Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

jobs:
  syntax-check-job:
    name: Python Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"

      - name: Check Python Syntax
        run: python -m compileall app

  image-build-job:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: syntax-check-job

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: docker build -t focusspark-backend:ci .

      - name: List the Images
        run: docker image ls

  image-push-job:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: image-build-job
    if: github.event_name == 'push'

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Login To Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/focusspark-backend:latest .

      - name: Push Docker Image on DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/focusspark-backend:latest
